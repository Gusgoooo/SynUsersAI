<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M3 3.5L11 7L3 10.5" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <style>
      .font{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
      .title{font-size:58px;font-weight:780;fill:#020617;letter-spacing:0}
      .subtitle{font-size:22px;fill:#64748B}
      .section{font-size:26px;font-weight:720;fill:#0F172A}
      .cardTitle{font-size:26px;font-weight:720;fill:#0F172A}
      .body{font-size:18px;fill:#475569}
      .small{font-size:14px;fill:#64748B}
      .tiny{font-size:13px;fill:#64748B}
      .badge{font-size:13px;font-weight:720;fill:#1E293B;letter-spacing:.02em}
      .formula{font-size:15px;fill:#475569}
      .line{stroke:#94A3B8;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .softLine{stroke:#CBD5E1;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:7 9}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#FAFAFA"/>
  <rect x="44" y="44" width="1512" height="912" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#cardShadow)"/>

  <g class="font">
    <text x="88" y="118" class="title">SynUsers.AI 技术框架</text>
    <text x="90" y="158" class="subtitle">从来源数据蒸馏 AI 合成用户，再通过自然互动得到结论与可追溯报告。</text>

    <rect x="1146" y="76" width="356" height="96" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="1174" y="114" class="cardTitle" font-size="22">Design Contract</text>
    <text x="1174" y="144" class="body">自然发言，不套模板</text>
    <text x="1174" y="166" class="tiny">distillation-first · traceable · persona-locked</text>

    <text x="88" y="230" class="section">1. 数据蒸馏：来源材料变成 AI 合成用户</text>

    <g>
      <rect x="88" y="262" width="300" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
      <rect x="116" y="290" width="74" height="28" rx="7" fill="#DCFCE7"/>
      <text x="134" y="309" class="badge">INPUT</text>
      <text x="116" y="352" class="cardTitle">来源输入</text>
      <text x="116" y="382" class="body">人群描述 · CSV · Excel</text>
      <text x="116" y="405" class="small">Word · TXT · 话题资料</text>
    </g>

    <g>
      <rect x="452" y="262" width="300" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
      <rect x="480" y="290" width="86" height="28" rx="7" fill="#DBEAFE"/>
      <text x="498" y="309" class="badge">DISTILL</text>
      <text x="480" y="352" class="cardTitle">记忆蒸馏</text>
      <text x="480" y="382" class="body">语义记忆 · 复合经历</text>
      <text x="480" y="405" class="small">消费习惯 · 语言语域</text>
    </g>

    <g>
      <rect x="816" y="262" width="300" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
      <rect x="844" y="290" width="88" height="28" rx="7" fill="#F1F5F9"/>
      <text x="862" y="309" class="badge">PERSONA</text>
      <text x="844" y="352" class="cardTitle">AI 合成用户</text>
      <text x="844" y="382" class="body">背景 · 立场 · OCEAN</text>
      <text x="844" y="405" class="small">偏见 · 触发点 · 决策捷径</text>
    </g>

    <g>
      <rect x="1180" y="262" width="300" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
      <rect x="1208" y="290" width="64" height="28" rx="7" fill="#FEF3C7"/>
      <text x="1226" y="309" class="badge">FIT</text>
      <text x="1208" y="352" class="cardTitle">话题适配</text>
      <text x="1208" y="382" class="body">熟悉度 · 相关度 · 误解</text>
      <text x="1208" y="405" class="small">判断入口 · 可见特征</text>
    </g>

    <path d="M400 337H438" class="line"/>
    <path d="M764 337H802" class="line"/>
    <path d="M1128 337H1166" class="line"/>

    <rect x="88" y="456" width="1392" height="154" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="118" y="500" class="section">人类式记忆系统</text>
    <text x="118" y="530" class="body">来源不会被前台逐字引用，而是变成每个用户会记住、在意、害怕、相信和忽略的东西。</text>

    <g>
      <rect x="118" y="558" width="146" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="154" y="585" class="body" font-weight="680">语义记忆</text>
    </g>
    <g>
      <rect x="286" y="558" width="146" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="322" y="585" class="body" font-weight="680">复合经历</text>
    </g>
    <g>
      <rect x="454" y="558" width="146" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="490" y="585" class="body" font-weight="680">消费习惯</text>
    </g>
    <g>
      <rect x="622" y="558" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="659" y="585" class="body" font-weight="680">教育与认知</text>
    </g>
    <g>
      <rect x="814" y="558" width="146" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="850" y="585" class="body" font-weight="680">社会身份</text>
    </g>
    <g>
      <rect x="982" y="558" width="146" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="1018" y="585" class="body" font-weight="680">情绪触发</text>
    </g>
    <g>
      <rect x="1150" y="558" width="146" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="1186" y="585" class="body" font-weight="680">语言语域</text>
    </g>
    <g>
      <rect x="1318" y="558" width="132" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="1350" y="585" class="body" font-weight="680">决策捷径</text>
    </g>

    <path d="M800 626V664" class="softLine"/>
    <text x="622" y="686" class="small">source anchors stay private; explanations and reports surface them when needed</text>

    <text x="88" y="740" class="section">2. 运行时：AI 合成用户变成社会模拟</text>

    <g>
      <rect x="88" y="774" width="312" height="146" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
      <text x="118" y="824" class="cardTitle">上下文优化</text>
      <text x="118" y="858" class="body">只取本轮需要的线索</text>
      <text x="118" y="882" class="small">私有记忆 · 最近发言 · 房间态度图</text>
    </g>

    <g>
      <rect x="456" y="774" width="312" height="146" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
      <text x="486" y="824" class="cardTitle">自然发言</text>
      <text x="486" y="858" class="body">每句话由模型实时生成</text>
      <text x="486" y="882" class="small">画像锁定 · 无模板 · 不脚本化</text>
    </g>

    <g>
      <rect x="824" y="774" width="312" height="146" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
      <text x="854" y="824" class="cardTitle">社会互动</text>
      <text x="854" y="858" class="body">互相影响并自然收敛</text>
      <text x="854" y="882" class="small">发言冲动 · 分歧量化 · 主持收窄</text>
    </g>

    <g>
      <rect x="1192" y="774" width="288" height="146" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
      <text x="1222" y="824" class="cardTitle">研究输出</text>
      <text x="1222" y="858" class="body">完整对话与 Markdown 报告</text>
      <text x="1222" y="882" class="small">Persona Prompt · A/B · 来源解释</text>
    </g>

    <path d="M412 847H444" class="line"/>
    <path d="M780 847H812" class="line"/>
    <path d="M1148 847H1180" class="line"/>

    <rect x="88" y="948" width="1392" height="1" fill="#E5E7EB"/>
    <text x="96" y="976" class="formula">Runtime formula: utterance = topic + persona core + topic fit + private memory + current social tension</text>
    <text x="1096" y="976" class="formula">结论来自互动推导，而不是预设脚本。</text>
  </g>
</svg>
